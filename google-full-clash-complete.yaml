# =============================================================================
# 使用说明 (rule-providers 引用示例)
# -----------------------------------------------------------------------------
# rule-providers:
#   google:
#     type: file              # 或 http
#     behavior: classical
#     path: ./rules/google_full.yaml
#     interval: 86400
#
# rules:
#   - RULE-SET,google,Google                  # 策略组名按自身规划
#
# 注意事项:
#   1. 此规则集包含 IP-CIDR 项 (Google Public DNS), 必须使用 classical 行为,
#      不可用 domain / ipcidr 单一行为
#   2. 若同时启用 fake-ip, 建议将 dns.google 加入 fake-ip-filter
#   3. 30 节关键词规则会与部分 *.cn / 大陆 CDN 域冲突 (例如 googleapis-cn.com
#      已显式列出, 但 keyword:google 会再次命中), 建议在主路由中将国内域名
#      规则集放在本规则集之前, 形成 "白名单先行" 顺序
#   4. blogger / blogspot 多 TLD 段已收录主流, 如需巴西/俄罗斯/欧洲全量,
#      可自行追加 (语义等价, 此处避免膨胀)
# =============================================================================
